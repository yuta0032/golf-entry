<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多胡杯ゴルフコンペ 管理画面</title>
<style>
  :root{
    --green:#2f6b3f; --green-d:#234f2f; --line:#dfe3dd;
    --bg:#f6f7f4; --ink:#1d231e; --muted:#6b756c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:16px 14px 50px}
  h1{font-size:18px; margin:0 0 2px}
  .sub{font-size:13px; color:var(--muted); margin:0 0 14px}
  .metrics{display:flex; gap:10px; margin-bottom:14px}
  .metric{flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px}
  .metric .l{font-size:12px; color:var(--muted)}
  .metric .v{font-size:22px; font-weight:700}
  .row{display:flex; gap:8px; margin-bottom:12px}
  select{width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink)}
  .chips{display:flex; gap:8px; margin-bottom:12px}
  .chip{flex:1; text-align:center; padding:9px 0; font-size:14px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer}
  .chip.on{background:var(--green); color:#fff; border-color:var(--green); font-weight:600}
  .search{position:relative; margin-bottom:14px}
  .search input{width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fff}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .nm{font-weight:700; font-size:15px}
  .kn{font-size:12px; color:var(--muted)}
  .badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  .b{font-size:12px; padding:3px 9px; border-radius:8px}
  .b-join{background:#e1f5ee; color:#085041}
  .b-no{background:#f1efe8; color:#444441}
  .b-m{background:#e6f1fb; color:#0c447c}
  .b-f{background:#fbeaf0; color:#72243e}
  .b-first{background:#faeeda; color:#633806}
  .b-age{background:#eef0ee; color:#3c463d}
  .meta{display:flex; justify-content:space-between; align-items:center; margin-top:10px}
  .meta a{font-size:14px; color:var(--green-d); text-decoration:none; font-weight:600}
  .meta .co{font-size:12px; color:var(--muted)}
  .note{text-align:center; color:var(--muted); padding:50px 10px}
  .setup{background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 16px}
  .setup h2{font-size:16px; margin:0 0 10px}
  .uid{font-family:monospace; font-size:13px; word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; margin:10px 0}
  .setup button{width:100%; padding:12px; font-size:15px; font-weight:700; color:#fff; background:var(--green); border:none; border-radius:10px; cursor:pointer; margin-top:6px}
  .setup ol{margin:14px 0 0; padding-left:20px; font-size:13px; color:var(--muted)}
  .setup code{background:var(--bg); padding:1px 5px; border-radius:4px}

  /* ===== 印刷用一覧 ===== */
  .pbtn{padding:10px 14px; font-size:14px; font-weight:600; color:var(--green-d); background:#fff;
        border:1px solid var(--line); border-radius:10px; cursor:pointer}
  .pbtn.go{background:var(--green); color:#fff; border-color:var(--green)}
  .pgrp{margin-bottom:12px}
  .plabel{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
  .pgrp label{display:inline-block; margin-right:14px; font-size:14px; white-space:nowrap}
  .pcols{display:flex; flex-wrap:wrap; gap:6px 0}
  .pcols label{flex:0 0 50%; margin:0; padding:3px 0}
  .pcols .empty{color:var(--muted); font-size:11px}
  .prow{display:flex; gap:8px; flex-wrap:wrap}
  .ptitle{font-size:15px; font-weight:700; margin:0 0 2px}
  .pmeta{font-size:12px; color:var(--muted); margin:0 0 8px}
  #printArea{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; overflow-x:auto}
  table.plist{border-collapse:collapse; width:100%; font-size:13px}
  table.plist th,table.plist td{border:1px solid #b9c0b9; padding:4px 6px; text-align:left;
        vertical-align:top; word-break:break-word; white-space:normal}
  table.plist th{background:#eef2ec; font-weight:700; white-space:nowrap}
  table.plist .num{text-align:right; white-space:nowrap; width:1%}
  /* 電話番号・日付・氏名など、途中で割れると読み違える値は折り返さない。
     列幅は指定していないので、残りの幅は備考などの長い列に自動で回る */
  table.plist td.nw{white-space:nowrap}

  @media print{
    body{background:#fff}
    .wrap{max-width:none; margin:0; padding:0}
    /* #printArea は .wrap > #app の中にあるので、階層ごとに兄弟だけを隠す
       （.wrap > * をまとめて隠すと祖先ごと消えて白紙になる） */
    .wrap > *:not(#app){display:none !important}
    #app > *:not(#printArea){display:none !important}
    #printArea{display:block !important; border:none; border-radius:0; padding:0; margin:0; overflow:visible}
    table.plist{font-size:calc(13px * var(--pscale,1))}
    thead{display:table-header-group}
    tr{break-inside:avoid; page-break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="note">読み込み中…</div></div>
</div>

<!-- LIFF の SDK は 130KB ある。<head> に置くと読み終わるまで本文が描かれず、
     回線が細いと真っ白な時間ができる。本文の後ろに移して、先に
     「読み込み中…」が出るようにしてある -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
/* ============================================================
   設定：最初は ADMIN_USERID を空のままデプロイ → 自分のLINEで開くと
   画面に自分のUserIDが出るので、それをここ(admin.html)とGASの
   ADMIN_USERID 両方に貼って、再デプロイする。
   ============================================================ */
const LIFF_ID = '2010392345-WMpqQivB';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzVfEJMWakJbssH2pRQQ8NesAy0UX9lGO4IB3Jh59VWoDsr62HHdWIkc4A8jbt1rZZe3Q/exec';
const ADMIN_USERID = 'Uf4fdbb2775ec9f55aea2e070c8252a73';   // ★ 設定済み
/* ============================================================ */

const app = document.getElementById('app');

/* 読み込みが遅いときの切り分け用。admin.html?debug=1 で開くと
   どの段で何秒かかったかを画面の下に出す。普段は何もしない */
const DEBUG = /[?&]debug=1/.test(location.search);
const T0 = Date.now();
const LAPS = [];
function lap(name){
  LAPS.push(name + ' ' + ((Date.now() - T0) / 1000).toFixed(2) + '秒');
  if(!DEBUG) return;
  let el = document.getElementById('laps');
  if(!el){
    el = document.createElement('pre');
    el.id = 'laps';
    el.style.cssText = 'margin:14px 0;padding:10px;background:#fff;border:1px solid var(--line);'
                     + 'border-radius:10px;font-size:12px;white-space:pre-wrap';
    document.querySelector('.wrap').appendChild(el);
  }
  el.textContent = LAPS.join('\n');
}
let profile = { userId:'', displayName:'' };
let token = '';
const RELOGIN_KEY = 'tagocup.admin.relogin';
/* 画面下に出す診断用。スクショ1枚で状況が分かるようにするため。
   BUILD は日付の版名（コミットの hash は自分自身には書けないので日付で代用） */
const BUILD = '2026-09-16a';
const DIAG = { tok:'none', res:'', t:0 };
let allRows = [];
let curEvent = '';
let curFilter = 'all';
let curQuery = '';

/* ============================================================
   年齢：基準日は大会当日。変えるときはこの AGE_BASE だけ直す
   ============================================================ */
const AGE_BASE = { y:2026, m:10, d:31 };
function ageBaseLabel(){ return AGE_BASE.y + '年' + AGE_BASE.m + '月' + AGE_BASE.d + '日'; }

/* 年・月・日の妥当性を見て {y,m,d} を返す。実在しない日付は null */
function ymd_(y, mo, d){
  if(!(y >= 1900 && y <= AGE_BASE.y)) return null;
  if(!(mo >= 1 && mo <= 12)) return null;
  if(!(d >= 1 && d <= 31)) return null;
  const t = new Date(y, mo - 1, d);
  if(t.getFullYear() !== y || t.getMonth() !== mo - 1 || t.getDate() !== d) return null;  // 2/30 などを弾く
  return { y:y, m:mo, d:d };
}

/* 生年月日を読む。読めない形は null を返して、無理に数字を出さない。
   受け付ける形： Date / YYYY-MM-DD / YYYY/MM/DD / YYYYMMDD /
                  ISO日時（GAS が Date を返した場合。シートは日本時間として読む） */
function parseBirth(v){
  if(v === undefined || v === null) return null;
  if(Object.prototype.toString.call(v) === '[object Date]'){
    return isNaN(v.getTime()) ? null : ymd_(v.getFullYear(), v.getMonth() + 1, v.getDate());
  }
  const s = String(v).trim();
  if(!s) return null;
  let m;
  if((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/))) return ymd_(+m[1], +m[2], +m[3]);
  if(/^\d{4}-\d{2}-\d{2}[T ]/.test(s)){
    /* ISO日時。UTC の瞬間を日本時間(+09:00)の日付に直してから使う。
       そうしないと 1985-11-15 が 11-14 にずれる */
    const t = new Date(s);
    if(isNaN(t.getTime())) return null;
    const j = new Date(t.getTime() + 9 * 3600 * 1000);
    return ymd_(j.getUTCFullYear(), j.getUTCMonth() + 1, j.getUTCDate());
  }
  if((m = s.match(/^(\d{8})$/))) return ymd_(+s.slice(0,4), +s.slice(4,6), +s.slice(6,8));
  return null;
}

/* 基準日時点の満年齢。誕生日が基準日と同日ならその年齢に達している扱い */
function calcAge(v){
  const b = parseBirth(v);
  if(!b) return null;
  let a = AGE_BASE.y - b.y;
  if(AGE_BASE.m < b.m || (AGE_BASE.m === b.m && AGE_BASE.d < b.d)) a--;
  return (a >= 0 && a <= 130) ? a : null;
}
function ageText(r){ const a = calcAge(r && r.birth); return a === null ? '' : String(a); }

/* ===== 印刷用一覧：出せる項目 =====
   d:true は既定でオン。GAS が返していない項目は空欄になる（画面上は「データなし」と出る） */
const PCOLS = [
  { k:'name',        t:'姓名',       d:true,  nw:true  },
  { k:'kana',        t:'フリガナ',   d:true,  nw:true  },
  { k:'phone',       t:'携帯番号',   d:true,  nw:true  },
  { k:'email',       t:'メール',     d:false, nw:false },
  { k:'birth',       t:'生年月日',   d:false, nw:true  },
  { k:'__age',       t:'年齢',       d:true,  nw:true  },
  { k:'gender',      t:'性別',       d:false, nw:true  },
  { k:'firstTime',   t:'初参加',     d:true,  nw:true  },
  { k:'referrer',    t:'紹介者',     d:true,  nw:true  },
  { k:'company',     t:'会社参加',   d:false, nw:true  },
  { k:'companyName', t:'会社名',     d:true,  nw:false },
  { k:'receipt',     t:'領収書',     d:true,  nw:true  },
  { k:'note',        t:'備考',       d:true,  nw:false },
  { k:'displayName', t:'LINE表示名', d:false, nw:false },
  { k:'timestamp',   t:'登録日時',   d:false, nw:true  }
];
const PCOLS_KEY = 'tagocup.printCols';
let pList = 'join';        // 'join'=参加者 / 'no'=不参加者
let pOn = {};              // 選ばれている項目

async function main(){
  lap('開始');
  await liff.init({ liffId: LIFF_ID });
  lap('liff.init 完了');
  if(!liff.isLoggedIn()){ liff.login({ redirectUri: window.location.href }); return; }

  /* 幹事かどうかは ID トークンを復号すれば分かる。
     liff.getProfile() は LINE と1往復するぶん表示が遅れるので、
     取れなかったときだけ従来どおり getProfile() に落とす */
  let me = null;
  try { me = liff.getDecodedIDToken(); } catch(e){}
  if(me && me.sub){
    profile = { userId: me.sub, displayName: me.name || '' };
    lap('本人確認（IDトークン・往復なし）');
  }else{
    profile = await liff.getProfile();
    lap('本人確認（getProfile・LINEと1往復）');
  }
  /* 資格情報。アクセストークンが取れないブラウザがあるので、
     取れなければ ID トークンで代用する（GAS 側がどちらでも受ける） */
  if(!hasCredential()){
    recoverOnce('no-credential');
    return;
  }

  if(!ADMIN_USERID){ showSetup(); return; }
  if(profile.userId !== ADMIN_USERID){ showDenied(); return; }
  loadList();
}

function showSetup(){
  app.innerHTML =
    '<div class="setup">'
    + '<h2>セットアップ</h2>'
    + '<p style="font-size:13px;color:var(--muted);margin:0">あなたのLINE UserIDです。これを管理者として設定すると、以後はあなただけがこの画面を見られます。</p>'
    + '<div class="uid" id="uid">'+escapeHtml(profile.userId)+'</div>'
    + '<button onclick="copyId()">UserIDをコピー</button>'
    + '<ol>'
      + '<li><code>admin.html</code> の <code>ADMIN_USERID</code> にこのIDを貼る</li>'
      + '<li>GASの <code>名簿用.gs</code> の <code>ADMIN_USERID</code> にも同じIDを貼る</li>'
      + '<li>GASを再デプロイ＋admin.htmlを差し替えると、管理画面が有効になります</li>'
    + '</ol>'
    + '</div>';
}

function copyId(){
  navigator.clipboard.writeText(profile.userId).then(function(){
    const u=document.getElementById('uid'); if(u) u.style.borderColor='var(--green)';
  }).catch(function(){});
}

function showDenied(){
  app.innerHTML = '<div class="note">このアカウントでは管理画面を閲覧できません。<br><small style="word-break:break-all">'+escapeHtml(profile.userId)+'</small></div>';
}

/* GAS の応答は普段1〜2秒だが、混み合うと30秒以上かかることがある。
   今までは待ち続けるだけで画面が「読み込み中…」のまま固まって見えた。

   ・8秒を過ぎたら「混んでいます」と経過秒数を出す（何も起きていないように見えない）
   ・それでも待ち続ける。40秒で返ってきた応答もちゃんと表示する
   ・自動での引き直しはしない。混んでいるところに要求を重ねると余計に詰まるため。
     代わりに「読み込み直す」ボタンを出して、押すかどうかは人が決める
   ・60秒であきらめて、状況を説明して終わる */
const LIST_SLOW_MS   = 8000;
const LIST_GIVEUP_MS = 20000;

/* 送るときに取り直す。ID トークンは期限が短いので、作ってすぐ投げる */
function credentialParam(){
  let t = '';
  try { t = liff.getAccessToken() || ''; } catch(e){}
  if(t){ DIAG.tok = 'access'; return '&token=' + encodeURIComponent(t); }
  let i = '';
  try { i = liff.getIDToken() || ''; } catch(e){}
  if(i){ DIAG.tok = 'id'; return '&id_token=' + encodeURIComponent(i); }
  DIAG.tok = 'none';
  return '';
}

/* 何で失敗しても、まず一度だけログインをやり直す。
   外部ブラウザではトークンが一日で切れるが isLoggedIn() は true のままなので、
   「取れている＝使える」とは限らない。取り直せば大抵これで通る。
   2回やっても駄目なら、LINEアプリで開いてもらう。 */
function recoverOnce(why){
  DIAG.res = why;
  if(!markedRelogin()){
    markRelogin();
    lap('自動でログインし直す（' + why + '）');
    app.innerHTML = '<div class="note">ログインし直しています…' + diagHtml() + '</div>';
    try { liff.login({ redirectUri: window.location.href }); return; } catch(e){}
  }
  showOpenInLine();
}

function diagHtml(){
  let login = '?';
  try { login = String(!!liff.isLoggedIn()); } catch(e){}
  return '<div style="margin-top:14px;font-size:11px;color:#9aa39b;line-height:1.5">'
    + 'v=' + BUILD + ' login=' + login + ' tok=' + DIAG.tok
    + ' res=' + (DIAG.res || '-') + ' t=' + DIAG.t + 's</div>';
}
function showDiag(){
  const el = document.createElement('div');
  el.innerHTML = diagHtml();
  const w = document.querySelector('.wrap');
  if(w) w.appendChild(el);
}
function hasCredential(){ return credentialParam() !== ''; }

/* ログインのやり直しを1回だけにするための印。
   sessionStorage が使えない環境もあるので、必ず try で囲う */
function markedRelogin(){ try { return sessionStorage.getItem(RELOGIN_KEY) === '1'; } catch(e){ return true; } }
function markRelogin(){ try { sessionStorage.setItem(RELOGIN_KEY, '1'); } catch(e){} }
function clearRelogin(){ try { sessionStorage.removeItem(RELOGIN_KEY); } catch(e){} }

function showOpenInLine(){
  const url = 'https://liff.line.me/' + LIFF_ID + '/admin.html';
  app.innerHTML =
    '<div class="note">このブラウザではLINEのログイン情報を取得できませんでした。<br>'
    + '<b>LINEアプリから開いてください。</b>'
    + '<div class="uid" style="text-align:left">' + escapeHtml(url) + '</div>'
    + '<a class="pbtn" style="display:inline-block;text-decoration:none" href="' + escapeHtml(url) + '">LINEで開く</a>'
    + '<br><br><button class="pbtn" onclick="reLogin()">もう一度ログインする</button>'
    + '<p class="hint" style="margin-top:12px">別のLINEアカウントでログインしている場合も、これが出ます。</p>'
    + diagHtml() + '</div>';
}

function loadList(){
  lap('一覧の取得を開始');
  const t0 = Date.now();
  let settled = false;
  let slowTimer = null, giveUpTimer = null, tick = null;
  const clearAll = function(){ clearTimeout(slowTimer); clearTimeout(giveUpTimer); clearInterval(tick); };

  const waiting = function(msg){
    app.innerHTML = '<div class="note">' + msg
      + '<br><small id="waitsec"></small>'
      + '<br><br><button class="pbtn" onclick="location.reload()">読み込み直す</button></div>';
  };

  window.__list = function(res){
    if(settled) return;
    settled = true; clearAll();
    DIAG.t = Math.round((Date.now() - t0) / 1000);
    lap('一覧を受信');
    if(!res || res.error){
      /* forbidden も no token も、まずは取り直せば通ることが多い */
      recoverOnce(res && res.error ? String(res.error) : 'error');
      return;
    }
    DIAG.res = 'ok';
    clearRelogin();                 // 出たら印を消す。翌日また1回使えるように
    try{ renderDash(res); showDiag(); }
    catch(e){ app.innerHTML='<div class="note">表示に失敗しました。</div>'; }
    lap('描画完了');
  };

  slowTimer = setTimeout(function(){
    if(settled) return;
    waiting('サーバーが混み合っているようです。まだ待っています。');
    tick = setInterval(function(){
      const el = document.getElementById('waitsec');
      if(el) el.textContent = Math.round((Date.now() - t0) / 1000) + '秒経過';
    }, 1000);
  }, LIST_SLOW_MS);

  giveUpTimer = setTimeout(function(){
    if(settled) return;
    settled = true; clearAll();
    DIAG.t = Math.round((Date.now() - t0) / 1000);
    recoverOnce('timeout');
  }, LIST_GIVEUP_MS);

  const cred = credentialParam();
  if(!cred){
    settled = true; clearAll();
    recoverOnce('no-credential');
    return;
  }
  const s = document.createElement('script');
  s.src = GAS_URL + '?action=list' + cred
        + '&callback=__list&t=' + Date.now();   // 途中のキャッシュに当たらないようにする
  s.onerror = function(){
    if(settled) return;
    settled = true; clearAll();
    DIAG.t = Math.round((Date.now() - t0) / 1000);
    recoverOnce('neterr');
  };
  /* 読み込みは終わったのに __list が呼ばれない＝返ってきたものが
     JavaScript ではなかった、ということ。黙って待ち続けても無駄なので
     すぐ知らせる。ブラウザによっては onerror が出ないので、この受けが要る。 */
  s.onload = function(){
    setTimeout(function(){
      if(settled) return;
      settled = true; clearAll();
      DIAG.t = Math.round((Date.now() - t0) / 1000);
      recoverOnce('notjs');        // 読めたのに呼ばれない＝応答が JavaScript でない
    }, 0);
  };
  document.body.appendChild(s);
}

function reLogin(){
  clearRelogin();
  try { liff.login({ redirectUri: window.location.href }); }
  catch(e){ location.reload(); }
}

function renderDash(res){
  if(!res || res.error){ showDenied(); return; }
  allRows = res.rows || [];
  const events = {};
  /* 回999 は動作確認用なので、選べる回には出さない（印刷側でも除いている） */
  allRows.forEach(function(r){
    if(r.eventNo==='' || r.eventNo==null) return;
    if(String(r.eventNo)==='999') return;
    events[r.eventNo]=true;
  });
  const evlist = Object.keys(events).sort(function(a,b){ return Number(b)-Number(a); });
  curEvent = evlistDefault(evlist);

  app.innerHTML =
    '<h1>多胡杯ゴルフコンペ 管理</h1>'
    + '<p class="sub" id="sub"></p>'
    + '<div class="row"><select id="evsel" onchange="onEvent()"></select></div>'
    + '<div class="metrics">'
      + '<div class="metric"><div class="l">参加</div><div class="v" id="cJoin">0</div></div>'
      + '<div class="metric"><div class="l">不参加</div><div class="v" id="cNo">0</div></div>'
    + '</div>'
    + '<div class="chips">'
      + '<div class="chip on" data-f="all" onclick="onFilter(this)">全員</div>'
      + '<div class="chip" data-f="参加する" onclick="onFilter(this)">参加</div>'
      + '<div class="chip" data-f="参加しない" onclick="onFilter(this)">不参加</div>'
    + '</div>'
    + '<div class="search"><input id="q" type="text" placeholder="名前・フリガナで検索" oninput="onSearch(this.value)"></div>'
    + '<div class="row"><button class="pbtn" id="pToggle" onclick="togglePrint()">印刷用の一覧をつくる</button></div>'
    + '<div id="printPanel" hidden>'
      + '<div class="card">'
        + '<div class="pgrp"><span class="plabel">どちらを印刷しますか</span>'
          + '<label><input type="radio" name="plist" value="join" checked onchange="onPList(this)"> 参加者一覧</label>'
          + '<label><input type="radio" name="plist" value="no" onchange="onPList(this)"> 不参加者一覧</label>'
          + '<label><input type="radio" name="plist" value="pending" onchange="onPList(this)"> 前回参加・今回未申込</label>'
        + '</div>'
        + '<div class="pgrp"><span class="plabel">入れる項目（チェックしたものが印刷されます）</span>'
          + '<div class="pcols" id="pcols"></div>'
        + '</div>'
        + '<div class="prow">'
          + '<button class="pbtn go" onclick="doPrint()">印刷する</button>'
          + '<button class="pbtn" onclick="setAllCols(true)">全部入れる</button>'
          + '<button class="pbtn" onclick="setAllCols(false)">全部外す</button>'
        + '</div>'
      + '</div>'
    + '</div>'
    + '<div id="printArea" hidden></div>'
    + '<div id="list"></div>';

  // 回セレクトを構築
  const sel = document.getElementById('evsel');
  sel.innerHTML = evlist.map(function(e){ return '<option value="'+e+'">第'+e+'回</option>'; }).join('') || '<option value="">（データなし）</option>';
  if(curEvent) sel.value = curEvent;
  draw();
}

function evlistDefault(evlist){ return evlist.length ? evlist[0] : ''; }

function onEvent(){ curEvent = document.getElementById('evsel').value; draw(); drawPrint(); }
function onFilter(el){
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on'); curFilter = el.dataset.f; draw();
}
function onSearch(v){ curQuery = (v||'').trim(); draw(); }

/* ============================================================
   印刷用一覧
   ============================================================ */
function loadCols(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PCOLS_KEY) || 'null'); } catch(e){}
  pOn = {};
  PCOLS.forEach(function(c){
    pOn[c.k] = (saved && typeof saved[c.k] === 'boolean') ? saved[c.k] : c.d;
  });
}
function saveCols(){
  try { localStorage.setItem(PCOLS_KEY, JSON.stringify(pOn)); } catch(e){}
}

/* その項目を1件でも持っている人がいるか（GASが返していない項目を見分けるため） */
function colHasData(k){
  if(k === '__age') return allRows.some(function(r){ return calcAge(r.birth) !== null; });
  return allRows.some(function(r){ return r[k] !== undefined && r[k] !== null && String(r[k]) !== ''; });
}

function renderCols(){
  const box = document.getElementById('pcols');
  if(!box) return;
  box.innerHTML = PCOLS.map(function(c){
    const none = colHasData(c.k) ? '' : ' <span class="empty">（データなし）</span>';
    return '<label><input type="checkbox" data-k="' + c.k + '"' + (pOn[c.k] ? ' checked' : '')
         + ' onchange="onCol(this)"> ' + escapeHtml(c.t) + none + '</label>';
  }).join('');
}
function onCol(el){ pOn[el.dataset.k] = el.checked; saveCols(); drawPrint(); }
function setAllCols(v){
  PCOLS.forEach(function(c){ pOn[c.k] = v; });
  saveCols(); renderCols(); drawPrint();
}
function onPList(el){ pList = el.value; drawPrint(); }

function togglePrint(){
  const panel = document.getElementById('printPanel');
  const area  = document.getElementById('printArea');
  const list  = document.getElementById('list');
  const btn   = document.getElementById('pToggle');
  const open  = panel.hidden;
  panel.hidden = !open; area.hidden = !open; list.hidden = open;
  btn.textContent = open ? '通常の表示に戻る' : '印刷用の一覧をつくる';
  if(open){ loadCols(); renderCols(); drawPrint(); }
}

/* 今の回のひとつ前の回。台帳にある回のうち、今の回より小さい最大のもの */
function prevEvent(){
  const cur = Number(curEvent);
  let prev = null;
  allRows.forEach(function(r){
    const n = Number(r.eventNo);
    if(!isFinite(n) || n === 999) return;
    if(n < cur && (prev === null || n > prev)) prev = n;
  });
  return prev;
}

/* 印刷対象の行。回999（テスト）は必ず除く */
function printRows(){
  const sortByKana = function(a, b){
    return String(a.kana||'').localeCompare(String(b.kana||''), 'ja');
  };

  if(pList === 'pending'){
    /* 前の回に参加した人のうち、今の回にまだ申込が無い人。
       姓名で突き合わせる（台帳の重複判定も姓名なので精度は同じ） */
    const prev = prevEvent();
    if(prev === null) return [];
    const done = {};
    allRows.forEach(function(r){
      if(String(r.eventNo) === String(curEvent)) done[String(r.name||'').trim()] = true;
    });
    const seen = {};
    return allRows.filter(function(r){
      if(String(r.eventNo) !== String(prev)) return false;
      if(r.join !== '参加する') return false;
      const nm = String(r.name||'').trim();
      if(!nm || done[nm] || seen[nm]) return false;
      seen[nm] = true;
      return true;
    }).sort(sortByKana);
  }

  return allRows.filter(function(r){
    if(String(r.eventNo) !== String(curEvent)) return false;
    if(String(r.eventNo) === '999') return false;
    return pList === 'join' ? (r.join === '参加する') : (r.join !== '参加する');
  }).sort(sortByKana);
}

function selectedCols(){ return PCOLS.filter(function(c){ return pOn[c.k]; }); }

/* 列数に応じて 縦/横 と文字の大きさを決める（最小75%、それ以下は折り返しで対応） */
function pageSetup(n){
  const portrait = n <= 9;          // 既定の9項目（年齢を含む）までは A4縦に収める
  let scale = 1;
  if(portrait){ scale = n <= 6 ? 1 : (n === 7 ? 0.92 : (n === 8 ? 0.85 : 0.8)); }
  else        { scale = n <= 10 ? 1 : (n === 11 ? 0.92 : (n === 12 ? 0.85 : (n === 13 ? 0.8 : 0.75))); }
  return { orient: portrait ? 'portrait' : 'landscape', scale: scale };
}

/* 一番古い回には「前の回」が無いので、その選択肢は選べないようにする。
   選んだ状態で古い回に切り替えた場合は、参加者一覧に戻す */
function syncPendingOption(){
  const el = document.querySelector('input[name="plist"][value="pending"]');
  if(!el) return;
  const none = prevEvent() === null;
  el.disabled = none;
  if(el.parentNode) el.parentNode.style.opacity = none ? '.45' : '';
  if(none && pList === 'pending'){
    pList = 'join';
    const j = document.querySelector('input[name="plist"][value="join"]');
    if(j) j.checked = true;
  }
}

function drawPrint(){
  const area = document.getElementById('printArea');
  if(!area) return;
  syncPendingOption();
  const cols = selectedCols();
  const rows = printRows();
  const setup = pageSetup(cols.length);

  let st = document.getElementById('pageStyle');
  if(!st){ st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
  st.textContent = '@page{size:A4 ' + setup.orient + '; margin:12mm}';
  area.style.setProperty('--pscale', setup.scale);

  const prev = pList === 'pending' ? prevEvent() : null;
  const kind = pList === 'join' ? '参加者一覧'
             : (pList === 'no' ? '不参加者一覧'
             : '第' + (prev === null ? '―' : prev) + '回に参加・今回未申込の方');
  const title = '第' + curEvent + '回多胡杯ゴルフコンペ　' + kind
              + '（' + rows.length + '名）';
  const d = new Date();
  let printed = '印刷日：' + d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  if(pOn['__age']) printed += '　／　年齢は大会当日（' + ageBaseLabel() + '）時点';
  if(pList === 'pending') printed += '　／　姓名で突き合わせています。同姓同名の方は漏れることがあります';

  let body;
  if(!cols.length){
    body = '<p class="pmeta">項目が1つも選ばれていません。</p>';
  } else if(!rows.length){
    body = '<p class="pmeta">' + (pList === 'pending' && prev === null
      ? '前の回のデータが台帳にありません。'
      : '該当する方はいません。') + '</p>';
  } else {
    const head = '<tr><th class="num">No.</th>'
               + cols.map(function(c){ return '<th>' + escapeHtml(c.t) + '</th>'; }).join('')
               + '</tr>';
    const trs = rows.map(function(r, i){
      return '<tr><td class="num">' + (i+1) + '</td>'
           + cols.map(function(c){
               return '<td' + (c.nw ? ' class="nw"' : '') + '>' + escapeHtml(cellText(r, c.k)) + '</td>';
             }).join('')
           + '</tr>';
    }).join('');
    body = '<table class="plist"><thead>' + head + '</thead><tbody>' + trs + '</tbody></table>';
  }

  area.innerHTML = '<p class="ptitle">' + escapeHtml(title) + '</p>'
                 + '<p class="pmeta">' + escapeHtml(printed) + '</p>'
                 + body;
}

function cellText(r, k){
  if(k === '__age') return ageText(r);          // 年齢は生年月日から計算する項目
  const v = r[k];
  if(v === undefined || v === null) return '';
  return String(v);
}

function doPrint(){
  drawPrint();
  window.print();
}

function draw(){
  let rows = allRows.filter(function(r){ return String(r.eventNo)===String(curEvent); });
  const nJoin = rows.filter(function(r){ return r.join==='参加する'; }).length;
  const nNo   = rows.filter(function(r){ return r.join==='参加しない'; }).length;
  setText('cJoin', nJoin+'名');
  setText('cNo', nNo+'名');
  setText('sub', '第'+curEvent+'回 ・ 合計 '+rows.length+'名');

  if(curFilter!=='all') rows = rows.filter(function(r){ return r.join===curFilter; });
  if(curQuery) rows = rows.filter(function(r){ return ((r.name||'')+' '+(r.kana||'')).indexOf(curQuery)>-1; });
  rows.sort(function(a,b){ return String(a.kana||'').localeCompare(String(b.kana||''),'ja'); });

  document.getElementById('list').innerHTML = rows.length
    ? rows.map(card).join('')
    : '<div class="note">該当する人がいません。</div>';
}

function card(r){
  const joinB = r.join==='参加する' ? '<span class="b b-join">参加</span>' : '<span class="b b-no">不参加</span>';
  const gB = r.gender==='男性' ? '<span class="b b-m">男性</span>' : (r.gender==='女性' ? '<span class="b b-f">女性</span>' : '');
  const fB = r.firstTime==='はい' ? '<span class="b b-first">初参加</span>' : '';
  const age = calcAge(r.birth);
  const aB  = r.birth
    ? '<span class="b b-age">' + escapeHtml(String(r.birth))
      + (age === null ? '' : '（' + age + '歳）') + '</span>'
    : '';
  const tel = r.phone ? '<a href="tel:'+escapeHtml(r.phone)+'">'+escapeHtml(r.phone)+'</a>' : '<span class="co">―</span>';
  const co = r.company ? '<span class="co">'+escapeHtml(r.company)+'</span>' : '';
  return '<div class="card">'
    + '<div class="top"><div><div class="nm">'+escapeHtml(r.name||'')+'</div><div class="kn">'+escapeHtml(r.kana||'')+'</div></div>'+joinB+'</div>'
    + '<div class="badges">'+gB+fB+aB+'</div>'
    + '<div class="meta">'+tel+co+'</div>'
    + '</div>';
}

function setText(id,t){ const el=document.getElementById(id); if(el) el.textContent=t; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

main().catch(function(err){
  app.innerHTML='<div class="note">読み込みに失敗しました。<br><small>'+escapeHtml(String(err))+'</small></div>';
});
</script>
</body>
