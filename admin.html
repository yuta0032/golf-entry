<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多胡杯ゴルフコンペ 管理画面</title>
<style>
  :root{
    --green:#2f6b3f; --green-d:#234f2f; --line:#dfe3dd;
    --bg:#f6f7f4; --ink:#1d231e; --muted:#6b756c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:16px 14px 50px}
  h1{font-size:18px; margin:0 0 2px}
  .sub{font-size:13px; color:var(--muted); margin:0 0 14px}
  .metrics{display:flex; gap:10px; margin-bottom:14px}
  .metric{flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px}
  .metric .l{font-size:12px; color:var(--muted)}
  .metric .v{font-size:22px; font-weight:700}
  .row{display:flex; gap:8px; margin-bottom:12px}
  select{width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink)}
  .chips{display:flex; gap:8px; margin-bottom:12px}
  .chip{flex:1; text-align:center; padding:9px 0; font-size:14px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer}
  .chip.on{background:var(--green); color:#fff; border-color:var(--green); font-weight:600}
  .search{position:relative; margin-bottom:14px}
  .search input{width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fff}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .nm{font-weight:700; font-size:15px}
  .kn{font-size:12px; color:var(--muted)}
  .badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  .b{font-size:12px; padding:3px 9px; border-radius:8px}
  .b-join{background:#e1f5ee; color:#085041}
  .b-no{background:#f1efe8; color:#444441}
  .b-m{background:#e6f1fb; color:#0c447c}
  .b-f{background:#fbeaf0; color:#72243e}
  .b-first{background:#faeeda; color:#633806}
  .b-age{background:#eef0ee; color:#3c463d}
  .meta{display:flex; justify-content:space-between; align-items:center; margin-top:10px}
  .meta a{font-size:14px; color:var(--green-d); text-decoration:none; font-weight:600}
  .meta .co{font-size:12px; color:var(--muted)}
  .note{text-align:center; color:var(--muted); padding:50px 10px}
  .setup{background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 16px}
  .setup h2{font-size:16px; margin:0 0 10px}
  .uid{font-family:monospace; font-size:13px; word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; margin:10px 0}
  .setup button{width:100%; padding:12px; font-size:15px; font-weight:700; color:#fff; background:var(--green); border:none; border-radius:10px; cursor:pointer; margin-top:6px}
  .setup ol{margin:14px 0 0; padding-left:20px; font-size:13px; color:var(--muted)}
  .setup code{background:var(--bg); padding:1px 5px; border-radius:4px}

  /* ===== 未申込の札（最上部） ===== */
  .pendbar{display:flex; align-items:center; gap:7px; margin-bottom:12px; padding:11px 13px;
        font-size:14px; font-weight:600; color:#633806; background:#faeeda;
        border:1px solid #e8d4b0; border-radius:10px; cursor:pointer}
  .pendbar .n{font-size:18px; font-weight:700}
  .pendbar .ar{margin-left:auto; font-size:12px; font-weight:600; color:#8a6a35}
  /* 0人のときは押せないので、押せそうな見た目をやめる */
  .pendbar.zero{color:var(--muted); background:#fff; border-color:var(--line); cursor:default}
  .pendbox{margin-bottom:14px}
  .pendbox .hint{font-size:12px; color:var(--muted); margin:0 0 8px}

  /* ===== 未申込の詳細シート（下から出る） ===== */
  .pname{padding:0; border:0; background:none; font:inherit; color:var(--green-d);
        font-weight:700; text-decoration:underline; cursor:pointer}
  .sheetwrap{position:fixed; inset:0; z-index:50}
  .sheetbg{position:absolute; inset:0; background:rgba(0,0,0,.38)}
  .sheet{position:absolute; left:0; right:0; bottom:0; max-height:86vh; overflow-y:auto;
        background:#fff; border-radius:16px 16px 0 0;
        padding:14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
        box-shadow:0 -6px 24px rgba(0,0,0,.18)}
  .sheet .shead{display:flex; align-items:flex-start; gap:10px; margin-bottom:8px}
  .sheet .snm{font-size:17px; font-weight:700; line-height:1.35}
  .sheet .skn{font-size:12px; color:var(--muted)}
  .sheet .sx{margin-left:auto; flex:0 0 auto; width:34px; height:34px; line-height:1;
        border:1px solid var(--line); border-radius:50%; background:#fff;
        font-size:17px; color:var(--muted); cursor:pointer}
  .srow{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14px}
  .srow .k{flex:0 0 96px; padding-top:2px; font-size:12px; color:var(--muted)}
  .srow .v{flex:1; word-break:break-word}
  .srow .v.none{color:var(--muted)}
  .sheet a.tel{font-size:18px; font-weight:700; color:var(--green-d); text-decoration:none}
  .sheet a.mail{color:var(--green-d); text-decoration:none; word-break:break-all}
  .scopy{margin-top:7px; padding:7px 12px; font-size:13px; font-weight:600; color:var(--green-d);
        background:#fff; border:1px solid var(--line); border-radius:8px; cursor:pointer}

  /* ===== 印刷用一覧 ===== */
  .pbtn{padding:10px 14px; font-size:14px; font-weight:600; color:var(--green-d); background:#fff;
        border:1px solid var(--line); border-radius:10px; cursor:pointer}
  .pbtn.go{background:var(--green); color:#fff; border-color:var(--green)}
  .pgrp{margin-bottom:12px}
  .plabel{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
  .pgrp label{display:inline-block; margin-right:14px; font-size:14px; white-space:nowrap}
  .pcols{display:flex; flex-wrap:wrap; gap:6px 0}
  .pcols label{flex:0 0 50%; margin:0; padding:3px 0}
  .pcols .empty{color:var(--muted); font-size:11px}
  .prow{display:flex; gap:8px; flex-wrap:wrap}
  .ptitle{font-size:15px; font-weight:700; margin:0 0 2px}
  .pmeta{font-size:12px; color:var(--muted); margin:0 0 8px}
  #printArea{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; overflow-x:auto}
  table.plist{border-collapse:collapse; width:100%; font-size:13px}
  table.plist th,table.plist td{border:1px solid #b9c0b9; padding:4px 6px; text-align:left;
        vertical-align:top; word-break:break-word; white-space:normal}
  table.plist th{background:#eef2ec; font-weight:700; white-space:nowrap}
  table.plist .num{text-align:right; white-space:nowrap; width:1%}
  /* 電話番号・日付・氏名など、途中で割れると読み違える値は折り返さない。
     列幅は指定していないので、残りの幅は備考などの長い列に自動で回る */
  table.plist td.nw{white-space:nowrap}

  @media print{
    body{background:#fff}
    .wrap{max-width:none; margin:0; padding:0}
    /* #printArea は .wrap > #app の中にあるので、階層ごとに兄弟だけを隠す
       （.wrap > * をまとめて隠すと祖先ごと消えて白紙になる） */
    .wrap > *:not(#app){display:none !important}
    #app > *:not(#printArea){display:none !important}
    #printArea{display:block !important; border:none; border-radius:0; padding:0; margin:0; overflow:visible}
    table.plist{font-size:calc(13px * var(--pscale,1))}
    thead{display:table-header-group}
    tr{break-inside:avoid; page-break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="note">読み込み中…</div></div>
</div>

<!-- LIFF の SDK は 130KB ある。<head> に置くと読み終わるまで本文が描かれず、
     回線が細いと真っ白な時間ができる。本文の後ろに移して、先に
     「読み込み中…」が出るようにしてある -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
/* ============================================================
   設定：最初は ADMIN_USERID を空のままデプロイ → 自分のLINEで開くと
   画面に自分のUserIDが出るので、それをここ(admin.html)とGASの
   ADMIN_USERID 両方に貼って、再デプロイする。
   ============================================================ */
const LIFF_ID = '2010392345-WMpqQivB';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzVfEJMWakJbssH2pRQQ8NesAy0UX9lGO4IB3Jh59VWoDsr62HHdWIkc4A8jbt1rZZe3Q/exec';
const ADMIN_USERID = 'Uf4fdbb2775ec9f55aea2e070c8252a73';   // ★ 設定済み
/* ============================================================ */

const app = document.getElementById('app');

/* 読み込みが遅いときの切り分け用。admin.html?debug=1 で開くと
   どの段で何秒かかったかを画面の下に出す。普段は何もしない */
const DEBUG = /[?&]debug=1/.test(location.search);
const T0 = Date.now();
const LAPS = [];
function lap(name){
  LAPS.push(name + ' ' + ((Date.now() - T0) / 1000).toFixed(2) + '秒');
  if(!DEBUG) return;
  let el = document.getElementById('laps');
  if(!el){
    el = document.createElement('pre');
    el.id = 'laps';
    el.style.cssText = 'margin:14px 0;padding:10px;background:#fff;border:1px solid var(--line);'
                     + 'border-radius:10px;font-size:12px;white-space:pre-wrap';
    document.querySelector('.wrap').appendChild(el);
  }
  el.textContent = LAPS.join('\n');
}
let profile = { userId:'', displayName:'' };
let token = '';
const RELOGIN_KEY = 'tagocup.admin.relogin';
/* 画面下に出す診断用。スクショ1枚で状況が分かるようにするため。
   BUILD は日付の版名（コミットの hash は自分自身には書けないので日付で代用） */
const BUILD = '2026-10-08a';
const DIAG = { tok:'none', res:'', times:[], via:[] };
let allRows = [];
let curEvent = '';
let curFilter = 'all';
let curQuery = '';

/* ============================================================
   年齢：基準日は大会当日。変えるときはこの AGE_BASE だけ直す
   ============================================================ */
const AGE_BASE = { y:2026, m:10, d:31 };
function ageBaseLabel(){ return AGE_BASE.y + '年' + AGE_BASE.m + '月' + AGE_BASE.d + '日'; }

/* 年・月・日の妥当性を見て {y,m,d} を返す。実在しない日付は null */
function ymd_(y, mo, d){
  if(!(y >= 1900 && y <= AGE_BASE.y)) return null;
  if(!(mo >= 1 && mo <= 12)) return null;
  if(!(d >= 1 && d <= 31)) return null;
  const t = new Date(y, mo - 1, d);
  if(t.getFullYear() !== y || t.getMonth() !== mo - 1 || t.getDate() !== d) return null;  // 2/30 などを弾く
  return { y:y, m:mo, d:d };
}

/* 生年月日を読む。読めない形は null を返して、無理に数字を出さない。
   受け付ける形： Date / YYYY-MM-DD / YYYY/MM/DD / YYYYMMDD /
                  ISO日時（GAS が Date を返した場合。シートは日本時間として読む） */
function parseBirth(v){
  if(v === undefined || v === null) return null;
  if(Object.prototype.toString.call(v) === '[object Date]'){
    return isNaN(v.getTime()) ? null : ymd_(v.getFullYear(), v.getMonth() + 1, v.getDate());
  }
  const s = String(v).trim();
  if(!s) return null;
  let m;
  if((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/))) return ymd_(+m[1], +m[2], +m[3]);
  if(/^\d{4}-\d{2}-\d{2}[T ]/.test(s)){
    /* ISO日時。UTC の瞬間を日本時間(+09:00)の日付に直してから使う。
       そうしないと 1985-11-15 が 11-14 にずれる */
    const t = new Date(s);
    if(isNaN(t.getTime())) return null;
    const j = new Date(t.getTime() + 9 * 3600 * 1000);
    return ymd_(j.getUTCFullYear(), j.getUTCMonth() + 1, j.getUTCDate());
  }
  if((m = s.match(/^(\d{8})$/))) return ymd_(+s.slice(0,4), +s.slice(4,6), +s.slice(6,8));
  return null;
}

/* 基準日時点の満年齢。誕生日が基準日と同日ならその年齢に達している扱い */
function calcAge(v){
  const b = parseBirth(v);
  if(!b) return null;
  let a = AGE_BASE.y - b.y;
  if(AGE_BASE.m < b.m || (AGE_BASE.m === b.m && AGE_BASE.d < b.d)) a--;
  return (a >= 0 && a <= 130) ? a : null;
}
function ageText(r){ const a = calcAge(r && r.birth); return a === null ? '' : String(a); }

/* ===== 印刷用一覧：出せる項目 =====
   d:true は既定でオン。GAS が返していない項目は空欄になる（画面上は「データなし」と出る） */
const PCOLS = [
  { k:'name',        t:'姓名',       d:true,  nw:true  },
  { k:'kana',        t:'フリガナ',   d:true,  nw:true  },
  { k:'phone',       t:'携帯番号',   d:true,  nw:true  },
  { k:'email',       t:'メール',     d:false, nw:false },
  { k:'birth',       t:'生年月日',   d:false, nw:true  },
  { k:'__age',       t:'年齢',       d:true,  nw:true  },
  { k:'gender',      t:'性別',       d:false, nw:true  },
  { k:'firstTime',   t:'初参加',     d:true,  nw:true  },
  { k:'referrer',    t:'紹介者',     d:true,  nw:true  },
  { k:'company',     t:'会社参加',   d:false, nw:true  },
  { k:'companyName', t:'会社名',     d:true,  nw:false },
  { k:'receipt',     t:'領収書',     d:true,  nw:true  },
  { k:'note',        t:'備考',       d:true,  nw:false },
  { k:'displayName', t:'LINE表示名', d:false, nw:false },
  { k:'timestamp',   t:'登録日時',   d:false, nw:true  },
  /* only: その一覧のときだけ出す項目。最後の参加回は未申込一覧にしか値が無い */
  { k:'__lastNo',    t:'最後の参加回', d:true, nw:true, only:'pending' }
];
const PCOLS_KEY = 'tagocup.printCols';
let pList = 'join';        // 'join'=参加者 / 'no'=不参加者 / 'pending'=過去参加・今回未申込
let pOn = {};              // 選ばれている項目

async function main(){
  lap('開始');
  await liff.init({ liffId: LIFF_ID });
  lap('liff.init 完了');
  scrubUrl();          // 使用済みの code を住所欄に残さない

  /* ★トークンが既にあるなら、ログインの途中かどうかに関係なく先へ進む。
     ここで待たせると、実際には入れる人まで止めてしまう（16g の不具合） */
  if(hasCredential()){
    clearLoginFlight();
    lap('資格情報あり（ログイン待ちはしない）');
  } else if(!liff.isLoggedIn()){
    if(!startLogin()){
      /* すでにログインの途中。二重に始めると引換券が食い違う */
      app.innerHTML = '<div class="note">ログインの途中です。'
        + '<br>20秒ほど待つと、やり直せます。'
        + '<br><br>' + openInLineHtml()
        + '<br><br><button class="pbtn" onclick="reLogin()">やり直す</button>'
        + diagHtml() + '</div>';
    }
    return;
  }

  /* 幹事かどうかは ID トークンを復号すれば分かる。
     liff.getProfile() は LINE と1往復するぶん表示が遅れるので、
     取れなかったときだけ従来どおり getProfile() に落とす */
  let me = null;
  try { me = liff.getDecodedIDToken(); } catch(e){}
  if(me && me.sub){
    profile = { userId: me.sub, displayName: me.name || '' };
    lap('本人確認（IDトークン・往復なし）');
  }else{
    profile = await liff.getProfile();
    lap('本人確認（getProfile・LINEと1往復）');
  }
  /* 資格情報。アクセストークンが取れないブラウザがあるので、
     取れなければ ID トークンで代用する（GAS 側がどちらでも受ける） */
  if(!hasCredential()){
    recoverOnce('no-credential');
    return;
  }

  if(!ADMIN_USERID){ showSetup(); return; }
  if(profile.userId !== ADMIN_USERID){ showDenied(); return; }
  loadList();
}

function showSetup(){
  app.innerHTML =
    '<div class="setup">'
    + '<h2>セットアップ</h2>'
    + '<p style="font-size:13px;color:var(--muted);margin:0">あなたのLINE UserIDです。これを管理者として設定すると、以後はあなただけがこの画面を見られます。</p>'
    + '<div class="uid" id="uid">'+escapeHtml(profile.userId)+'</div>'
    + '<button onclick="copyId()">UserIDをコピー</button>'
    + '<ol>'
      + '<li><code>admin.html</code> の <code>ADMIN_USERID</code> にこのIDを貼る</li>'
      + '<li>GASの <code>名簿用.gs</code> の <code>ADMIN_USERID</code> にも同じIDを貼る</li>'
      + '<li>GASを再デプロイ＋admin.htmlを差し替えると、管理画面が有効になります</li>'
    + '</ol>'
    + '</div>';
}

function copyId(){
  navigator.clipboard.writeText(profile.userId).then(function(){
    const u=document.getElementById('uid'); if(u) u.style.borderColor='var(--green)';
  }).catch(function(){});
}

function showDenied(){
  app.innerHTML = '<div class="note">このアカウントでは管理画面を閲覧できません。<br><small style="word-break:break-all">'+escapeHtml(profile.userId)+'</small></div>';
}

/* GAS は普段1〜2秒で返るが、Google 側の実行開始が遅れて25秒以上かかることがある。
   そのときはログインし直しても直らないので、黙って引き直す。
   1回あたり40秒待ち、最大3回。エラー文は3回とも駄目だったときだけ出す。 */
/* 1回目・2回目は短めに切って引き直す。3回目だけ長めに待つ。最悪80秒。
   取りに行く手段は fetch を先に使う。LINE 内ブラウザでは <script> の JSONP が
   読み込み完了も失敗も通知してこないことがあり、そうなると何も起きないため。
   3回目だけ従来の JSONP を保険として残す。 */
const LIST_WAITS     = [15000, 20000, 40000];
const LIST_VIA       = ['worker', 'worker', 'jsonp'];
/* 名簿の中継役。Google の配信経路を通らずに済ませるために挟む。
   空のままなら worker の回は自動で GAS 直行（fetch）に落ちるので、
   Worker を止めても画面は死なない。 */
const WORKER_URL     = 'https://golf-list.yuta-ce7.workers.dev';
const LIST_MAX_TRIES = LIST_WAITS.length;
/* fetch の回は同時に2本投げて、先に正しく返った方を採る。
   Google の窓口は同じ要求でも返る回と取りこぼす回があるため、
   2本出しておくと片方が転んでも待たずに済む。負けた方は止める。 */
const LIST_PARALLEL  = 2;

/* 送るときに取り直す。ID トークンは期限が短いので、作ってすぐ投げる */
function credentialParam(){
  let t = '';
  try { t = liff.getAccessToken() || ''; } catch(e){}
  if(t){ DIAG.tok = 'access'; return '&token=' + encodeURIComponent(t); }
  let i = '';
  try { i = liff.getIDToken() || ''; } catch(e){}
  if(i){ DIAG.tok = 'id'; return '&id_token=' + encodeURIComponent(i); }
  DIAG.tok = 'none';
  return '';
}

/* ログインし直せば直る類（forbidden / no token / 資格情報なし）だけに使う。
   応答が遅い・届かないのはログインでは直らないので、ここへは回さない。
   外部ブラウザではトークンが一日で切れるが isLoggedIn() は true のままなので、
   「取れている＝使える」とは限らない。取り直せば大抵これで通る。
   2回やっても駄目なら、LINEアプリで開いてもらう。 */
function recoverOnce(why){
  DIAG.res = why;
  if(!markedRelogin()){
    markRelogin();
    lap('自動でログインし直す（' + why + '）');
    app.innerHTML = '<div class="note">ログインし直しています…' + diagHtml() + '</div>';
    if(startLogin()) return;
  }
  showOpenInLine();
}

function diagHtml(){
  let login = '?';
  try { login = String(!!liff.isLoggedIn()); } catch(e){}
  return '<div style="margin-top:14px;font-size:11px;color:#9aa39b;line-height:1.5">'
    + 'v=' + BUILD + ' login=' + login + ' tok=' + DIAG.tok
    + ' res=' + (DIAG.res || '-')
    + ' try=' + DIAG.times.length
    + ' via=' + (DIAG.via.join(',') || '-')
    + ' par=' + LIST_PARALLEL
    + ' t=' + (DIAG.times.length ? DIAG.times.join('s,') + 's' : '-') + '</div>';
}
function showDiag(){
  const el = document.createElement('div');
  el.innerHTML = diagHtml();
  const w = document.querySelector('.wrap');
  if(w) w.appendChild(el);
}

/* ログインのやり直しを1回だけにするための印。

function loadList(attempt){
  attempt = attempt || 1;
  let via = LIST_VIA[attempt - 1] || 'jsonp';
  if(via === 'worker' && !WORKER_URL) via = 'fetch';   // 未設定なら今までどおり GAS 直行
  const wait = LIST_WAITS[attempt - 1] || 20000;
  lap('一覧の取得（' + attempt + '回目・' + via + '）');
  DIAG.via.push(via);

  const t0 = Date.now();
  let settled = false;
  let timer = null;
  const secs = function(){ return ((Date.now() - t0) / 1000).toFixed(1); };

  app.innerHTML = '<div class="note">読み込み中…'
    + (attempt > 1 ? '（' + attempt + '回目）' : '') + '</div>';

  /* 届かない・読めないときはログインに飛ばさず、黙って引き直す */
  const retryOrGiveUp = function(why){
    if(settled) return;
    settled = true; clearTimeout(timer);
    DIAG.times.push(secs());
    DIAG.res = why;
    window.__list = function(){};                 // 遅れて返った分は捨てる
    if(attempt < LIST_MAX_TRIES){ loadList(attempt + 1); return; }
    app.innerHTML =
      '<div class="note">サーバーが混み合っていて名簿を読み込めませんでした。<br>'
      + '少し待ってから、もう一度お試しください。'
      + '<br><br><button class="pbtn" onclick="location.reload()">読み込み直す</button>'
      + diagHtml() + '</div>';
  };

  const handle = function(res){
    if(settled) return;
    settled = true; clearTimeout(timer);
    DIAG.times.push(secs());
    lap('一覧を受信');
    if(!res || res.error){
      /* これはログインし直せば直る類 */
      recoverOnce(res && res.error ? String(res.error) : 'error');
      return;
    }
    DIAG.res = 'ok';
    clearRelogin();                 // 出たら印を消す。翌日また1回使えるように
    try{ renderDash(res); showDiag(); }
    catch(e){ app.innerHTML='<div class="note">表示に失敗しました。</div>'; }
    lap('描画完了');
  };

  const cred = credentialParam();
  if(!cred){
    settled = true;
    recoverOnce('no-credential');
    return;
  }

  if(via === 'worker' || via === 'fetch'){
    /* callback を付けなければ GAS は JSON を返す。応答を読むので CORS が要るが、
       /exec も転送先も access-control-allow-origin: * を返すことを確認済み */
    const ctrls = [];
    const abortAll = function(){
      ctrls.forEach(function(c){ try { c.abort(); } catch(e){} });
    };
    const once = function(n){
      let c = null;
      try { c = new AbortController(); ctrls.push(c); } catch(e){}
      /* Worker 側は action=list を固定しているので、渡すのは資格情報と t だけ */
      const url = (via === 'worker')
        ? WORKER_URL + '/list?' + cred.slice(1) + '&t=' + Date.now() + '-' + n
        : GAS_URL + '?action=list' + cred + '&t=' + Date.now() + '-' + n;
      return fetch(url, { method:'GET', redirect:'follow', signal: c ? c.signal : undefined })
        .then(function(r){ return r.json(); });
    };

    timer = setTimeout(function(){ abortAll(); retryOrGiveUp('timeout'); }, wait);

    let fails = 0;
    for(let i = 0; i < LIST_PARALLEL; i++){
      once(i).then(function(res){
        if(settled) return;
        abortAll();                 // 勝った方を採る。負けた方は止める
        handle(res);
      }).catch(function(err){
        fails++;
        if(settled) return;
        if(fails >= LIST_PARALLEL){
          clearTimeout(timer);
          retryOrGiveUp((err && err.name === 'AbortError') ? 'timeout' : 'fetchfail');
        }
      });
    }
    return;
  }

  /* 保険の JSONP */
  window.__list = handle;
  timer = setTimeout(function(){ retryOrGiveUp('timeout'); }, wait);
  const s = document.createElement('script');
  s.src = GAS_URL + '?action=list' + cred
        + '&callback=__list&t=' + Date.now();
  s.onerror = function(){ retryOrGiveUp('neterr'); };
  s.onload = function(){ setTimeout(function(){ retryOrGiveUp('notjs'); }, 0); };
  document.body.appendChild(s);
}

/* LIFF がログインの戻りで付けてくる印。残ったまま再ログインすると、
   古い code を持ったまま新しい引換券が作られて code_verifier does not match になる */
const LIFF_PARAMS = ['code', 'state', 'liffClientId', 'liffRedirectUri', 'liff.state',
                     'error', 'error_description', 'liffErrorCode'];

/* LIFF の印を取り除いた、いまのページの URL */
function cleanUrl(){
  try {
    const u = new URL(window.location.href);
    LIFF_PARAMS.forEach(function(k){ u.searchParams.delete(k); });
    return u.toString();
  } catch(e){ return window.location.href; }
}

/* 戻ってきた後の住所欄から印を消す。
   このまま再読込されると、使用済みの code をもう一度引き換えようとして失敗する */
function scrubUrl(){
  try {
    const now = window.location.href;
    const cleaned = cleanUrl();
    if(cleaned !== now && window.history && window.history.replaceState){
      window.history.replaceState(null, '', cleaned);
    }
  } catch(e){}
}

/* ログインの二重開始よけ。
   LIFF は「引換券（code_verifier）」を1組しか覚えていないので、前のログインが
   終わらないうちに次を始めると、古い code と新しい引換券が食い違って
   「code_verifier does not match」になる。60秒は次を始めない。
   タブをまたぐので localStorage に置く（sessionStorage だと別タブで消える）。 */
const LOGIN_FLIGHT_KEY = 'tagocup.admin.loginAt';
/* 二重開始を防げれば十分なので短くする。長くすると、入れるはずの人を足止めする */
const LOGIN_FLIGHT_MS  = 20000;
/* LINE アプリで開くための入口。うまくいかないときの逃げ道として各所に出す */
const LIFF_OPEN_URL = 'https://liff.line.me/' + LIFF_ID + '/admin.html';
function openInLineHtml(){
  return '<div class="uid" style="text-align:left">' + escapeHtml(LIFF_OPEN_URL) + '</div>'
    + '<a class="pbtn" style="display:inline-block;text-decoration:none" href="'
    + escapeHtml(LIFF_OPEN_URL) + '">LINEで開く</a>';
}
function loginInFlight(){
  try {
    const t = Number(localStorage.getItem(LOGIN_FLIGHT_KEY) || 0);
    return !!t && (Date.now() - t) < LOGIN_FLIGHT_MS;
  } catch(e){ return false; }
}
function markLoginStart(){ try { localStorage.setItem(LOGIN_FLIGHT_KEY, String(Date.now())); } catch(e){} }
function clearLoginFlight(){ try { localStorage.removeItem(LOGIN_FLIGHT_KEY); } catch(e){} }

/** ログインを始める。すでに始まっていれば何もしない（false を返す） */
function startLogin(){
  if(loginInFlight()) return false;
  markLoginStart();
  try { liff.login({ redirectUri: cleanUrl() }); return true; } catch(e){ return false; }
}

function reLogin(){
  clearRelogin();
  clearLoginFlight();
  try { liff.login({ redirectUri: cleanUrl() }); }
  catch(e){ location.reload(); }
}

/* ============================================================
   未申込の札（最上部）

   過去の回に参加していて、今の回にまだ返事が無い人を出す。
   並びは「前回参加者 → その前の回」の順。回の中はフリガナ順。
   突き合わせは姓名で行う（台帳の重複判定も姓名なので精度は同じ）。
   GAS は触っていない。list で既に取ってある行だけで組んでいる
   ============================================================ */
let pendOpen = false;

function pendingAll(){
  const cur = Number(curEvent);
  if(!isFinite(cur)) return [];

  /* 今の回に返事を出している人は外す。
     「参加する」「参加しない」のほか、古い台帳の「参加できません」なども
     拾えるよう、値の中身は見ずに「埋まっているか」だけ見る */
  const done = {};
  allRows.forEach(function(r){
    if(String(r.eventNo) !== String(curEvent)) return;
    if(!String(r.join||'').trim()) return;
    done[String(r.name||'').trim()] = true;
  });

  /* 同じ人が何回も出てくるので、参加した一番新しい回だけ残す。
     回999 は動作確認用なので数えない */
  const best = {};
  allRows.forEach(function(r){
    const n = Number(r.eventNo);
    if(!isFinite(n) || n === 999 || n >= cur) return;
    if(r.join !== '参加する') return;
    const nm = String(r.name||'').trim();
    if(!nm || done[nm]) return;
    if(!best[nm] || n > best[nm].no) best[nm] = { no:n, name:nm, row:r };
  });

  return Object.keys(best).map(function(k){ return best[k]; }).sort(function(a, b){
    if(b.no !== a.no) return b.no - a.no;                       // 新しい回に参加した人を先に
    return String(a.row.kana||'').localeCompare(String(b.row.kana||''), 'ja');
  });
}

/* 連絡先は中身を出さず「あり／なし」だけ。この札は連絡を取る人を選ぶためのもの */
function hasContact(r){
  return !!(String(r.phone||'').trim() || String(r.email||'').trim());
}

function drawPend(){
  const bar = document.getElementById('pendBar');
  const box = document.getElementById('pendBox');
  if(!bar || !box) return;

  const list = pendingAll();
  pendCache = list;                 // 押されたときに引く。回を変えると作り直す
  closePendSheet();                 // 並びが変わるので、開いていたシートは閉じる
  bar.className = 'pendbar' + (list.length ? '' : ' zero');
  bar.innerHTML = '未申込 <span class="n">' + list.length + '</span> 人'
    + (list.length ? '<span class="ar">' + (pendOpen ? '閉じる ▲' : '見る ▼') + '</span>' : '');
  bar.onclick = list.length ? togglePend : null;

  if(!list.length){
    pendOpen = false;
    box.hidden = true;
    box.innerHTML = '';
    return;
  }

  box.hidden = !pendOpen;
  if(!pendOpen) return;

  box.innerHTML = '<div class="card pendbox">'
    + '<p class="hint">第' + curEvent + '回の返事がまだの、過去に参加された方です。'
    + '新しい回に参加された方から並んでいます。姓名で突き合わせているので、'
    + '同姓同名の方は漏れることがあります</p>'
    + '<table class="plist"><thead><tr>'
      + '<th class="num">#</th><th>氏名</th><th>最後の参加回</th><th>連絡先</th>'
    + '</tr></thead><tbody>'
    + list.map(function(p, i){
        return '<tr><td class="num">' + (i + 1) + '</td>'
          + '<td class="nw"><button class="pname" onclick="openPend(' + i + ')">'
            + escapeHtml(p.name) + '</button></td>'
          + '<td class="nw">第' + p.no + '回</td>'
          + '<td class="nw">' + (hasContact(p.row) ? 'あり' : 'なし') + '</td></tr>';
      }).join('')
    + '</tbody></table></div>';
}

function togglePend(){ pendOpen = !pendOpen; drawPend(); }

/* ===== 未申込の詳細シート =====
   値は list で既に取ってある行から出す。GAS は触っていない。
   連絡先は「最後に参加された回」の行のもの（札の あり／なし と同じ行を見ている） */
let pendCache = [];

function telHref(v){ return 'tel:' + String(v||'').replace(/[^0-9+]/g, ''); }

function srow(k, v, cls){
  const none = !String(v||'').trim();
  return '<div class="srow"><div class="k">' + escapeHtml(k) + '</div>'
       + '<div class="v' + (none ? ' none' : (cls ? ' ' + cls : '')) + '">'
       + (none ? '未登録' : v) + '</div></div>';
}

/* 最後に参加されたときの参加形態。会社参加なら会社名も添える */
function joinedAs(r){
  const c = String(r.company||'').trim();
  const n = String(r.companyName||'').trim();
  if(!c) return '';
  return c === '会社参加' && n ? escapeHtml(c) + '（' + escapeHtml(n) + '）' : escapeHtml(c);
}

function openPend(i){
  const p = pendCache[i];
  const box = document.getElementById('pendSheet');
  if(!p || !box) return;
  const r = p.row;
  const phone = String(r.phone||'').trim();
  const email = String(r.email||'').trim();

  box.className = 'sheetwrap';
  box.innerHTML =
      '<div class="sheetbg" onclick="closePendSheet()"></div>'
    + '<div class="sheet" role="dialog" aria-modal="true">'
      + '<div class="shead"><div>'
        + '<div class="snm">' + escapeHtml(p.name) + '</div>'
        + '<div class="skn">' + escapeHtml(r.kana||'') + '</div>'
      + '</div><button class="sx" onclick="closePendSheet()" aria-label="閉じる">×</button></div>'
      + srow('携帯', phone
          ? '<a class="tel" href="' + escapeHtml(telHref(phone)) + '">' + escapeHtml(phone) + '</a>'
            + '<div><button class="scopy" onclick="copyPhone(this, \'' + escapeHtml(phone) + '\')">コピー</button></div>'
          : '')
      + srow('メール', email
          ? '<a class="mail" href="mailto:' + escapeHtml(email) + '">' + escapeHtml(email) + '</a>' : '')
      + srow('LINE表示名', String(r.displayName||'').trim() ? 'あり' : 'なし')
      + srow('最後の参加', '第' + p.no + '回'
          + (joinedAs(r) ? '　' + joinedAs(r) : ''))
      + srow('紹介者', escapeHtml(String(r.referrer||'').trim()))
      + srow('備考', escapeHtml(String(r.note||'').trim()))
    + '</div>';
  box.hidden = false;
}

function closePendSheet(){
  const box = document.getElementById('pendSheet');
  if(!box) return;
  box.hidden = true;
  box.className = '';
  box.innerHTML = '';
}

/* LINE の中のブラウザでは clipboard が使えないことがあるので、古いやり方も用意する */
function copyPhone(btn, v){
  const done = function(ok){ btn.textContent = ok ? 'コピーしました' : '長押しでコピーしてください';
    setTimeout(function(){ btn.textContent = 'コピー'; }, 1800); };
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(v).then(function(){ done(true); }, function(){ done(false); });
      return;
    }
  } catch(e){}
  try {
    const t = document.createElement('textarea');
    t.value = v; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(t);
    done(ok);
  } catch(e){ done(false); }
}

/* ============================================================
   印刷用一覧
   ============================================================ */
function loadCols(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PCOLS_KEY) || 'null'); } catch(e){}
  pOn = {};
  PCOLS.forEach(function(c){
    pOn[c.k] = (saved && typeof saved[c.k] === 'boolean') ? saved[c.k] : c.d;
  });
}
function saveCols(){
  try { localStorage.setItem(PCOLS_KEY, JSON.stringify(pOn)); } catch(e){}
}

/* その項目を1件でも持っている人がいるか（GASが返していない項目を見分けるため） */
function colHasData(k){
  if(k === '__age') return allRows.some(function(r){ return calcAge(r.birth) !== null; });
  if(k === '__lastNo') return true;             // 未申込一覧でしか出さず、そこでは必ず値がある
  return allRows.some(function(r){ return r[k] !== undefined && r[k] !== null && String(r[k]) !== ''; });
}

function renderCols(){
  const box = document.getElementById('pcols');
  if(!box) return;
  box.innerHTML = activeCols().map(function(c){
    const none = colHasData(c.k) ? '' : ' <span class="empty">（データなし）</span>';
    return '<label><input type="checkbox" data-k="' + c.k + '"' + (pOn[c.k] ? ' checked' : '')
         + ' onchange="onCol(this)"> ' + escapeHtml(c.t) + none + '</label>';
  }).join('');
}
function onCol(el){ pOn[el.dataset.k] = el.checked; saveCols(); drawPrint(); }
function setAllCols(v){
  PCOLS.forEach(function(c){ pOn[c.k] = v; });
  saveCols(); renderCols(); drawPrint();
}
function onPList(el){ pList = el.value; renderCols(); drawPrint(); }

function togglePrint(){
  const panel = document.getElementById('printPanel');
  const area  = document.getElementById('printArea');
  const list  = document.getElementById('list');
  const btn   = document.getElementById('pToggle');
  const open  = panel.hidden;
  panel.hidden = !open; area.hidden = !open; list.hidden = open;
  btn.textContent = open ? '通常の表示に戻る' : '印刷用の一覧をつくる';
  if(open){ loadCols(); renderCols(); drawPrint(); }
}

/* 今の回のひとつ前の回。台帳にある回のうち、今の回より小さい最大のもの */
function prevEvent(){
  const cur = Number(curEvent);
  let prev = null;
  allRows.forEach(function(r){
    const n = Number(r.eventNo);
    if(!isFinite(n) || n === 999) return;
    if(n < cur && (prev === null || n > prev)) prev = n;
  });
  return prev;
}

/* 印刷対象の行。回999（テスト）は必ず除く */
function printRows(){
  const sortByKana = function(a, b){
    return String(a.kana||'').localeCompare(String(b.kana||''), 'ja');
  };

  if(pList === 'pending'){
    /* 最上部の札とまったく同じ計算を使う。数が2つにならないよう、
       数え方は pendingAll() の1か所だけに置いている。
       並びも pendingAll() が決めた順（新しい回の人から、回の中はフリガナ順）をそのまま使う */
    return pendingAll().map(function(p){
      const r = {};
      for(const k in p.row) r[k] = p.row[k];
      r.__lastNo = p.no;                      // 「最後の参加回」の列で使う
      return r;
    });
  }

  return allRows.filter(function(r){
    if(String(r.eventNo) !== String(curEvent)) return false;
    if(String(r.eventNo) === '999') return false;
    return pList === 'join' ? (r.join === '参加する') : (r.join !== '参加する');
  }).sort(sortByKana);
}

/* 今の一覧で出せる項目。only が付いた項目はその一覧のときだけ出す */
function activeCols(){
  return PCOLS.filter(function(c){ return !c.only || c.only === pList; });
}
function selectedCols(){ return activeCols().filter(function(c){ return pOn[c.k]; }); }

/* 列数に応じて 縦/横 と文字の大きさを決める（最小75%、それ以下は折り返しで対応） */
function pageSetup(n){
  const portrait = n <= 9;          // 既定の9項目（年齢を含む）までは A4縦に収める
  let scale = 1;
  if(portrait){ scale = n <= 6 ? 1 : (n === 7 ? 0.92 : (n === 8 ? 0.85 : 0.8)); }
  else        { scale = n <= 10 ? 1 : (n === 11 ? 0.92 : (n === 12 ? 0.85 : (n === 13 ? 0.8 : 0.75))); }
  return { orient: portrait ? 'portrait' : 'landscape', scale: scale };
}

/* 一番古い回には「過去の回」が無いので、その選択肢は選べないようにする。
   選んだ状態で古い回に切り替えた場合は、参加者一覧に戻す */
function syncPendingOption(){
  const el = document.querySelector('input[name="plist"][value="pending"]');
  if(!el) return;
  const none = prevEvent() === null;
  el.disabled = none;
  if(el.parentNode) el.parentNode.style.opacity = none ? '.45' : '';
  if(none && pList === 'pending'){
    pList = 'join';
    const j = document.querySelector('input[name="plist"][value="join"]');
    if(j) j.checked = true;
  }
}

function drawPrint(){
  const area = document.getElementById('printArea');
  if(!area) return;
  syncPendingOption();
  const cols = selectedCols();
  const rows = printRows();
  const setup = pageSetup(cols.length);

  let st = document.getElementById('pageStyle');
  if(!st){ st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
  st.textContent = '@page{size:A4 ' + setup.orient + '; margin:12mm}';
  area.style.setProperty('--pscale', setup.scale);

  const kind = pList === 'join' ? '参加者一覧'
             : (pList === 'no' ? '不参加者一覧'
             : '過去参加・今回未申込の方');
  const title = '第' + curEvent + '回多胡杯ゴルフコンペ　' + kind
              + '（' + rows.length + '名）';
  const d = new Date();
  let printed = '印刷日：' + d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  if(pOn['__age']) printed += '　／　年齢は大会当日（' + ageBaseLabel() + '）時点';
  if(pList === 'pending') printed += '　／　姓名で突き合わせています。同姓同名の方は漏れることがあります';

  let body;
  if(!cols.length){
    body = '<p class="pmeta">項目が1つも選ばれていません。</p>';
  } else if(!rows.length){
    body = '<p class="pmeta">' + (pList === 'pending' && prevEvent() === null
      ? '過去の回のデータが台帳にありません。'
      : '該当する方はいません。') + '</p>';
  } else {
    const head = '<tr><th class="num">No.</th>'
               + cols.map(function(c){ return '<th>' + escapeHtml(c.t) + '</th>'; }).join('')
               + '</tr>';
    const trs = rows.map(function(r, i){
      return '<tr><td class="num">' + (i+1) + '</td>'
           + cols.map(function(c){
               return '<td' + (c.nw ? ' class="nw"' : '') + '>' + escapeHtml(cellText(r, c.k)) + '</td>';
             }).join('')
           + '</tr>';
    }).join('');
    body = '<table class="plist"><thead>' + head + '</thead><tbody>' + trs + '</tbody></table>';
  }

  area.innerHTML = '<p class="ptitle">' + escapeHtml(title) + '</p>'
                 + '<p class="pmeta">' + escapeHtml(printed) + '</p>'
                 + body;
}

function cellText(r, k){
  if(k === '__age') return ageText(r);          // 年齢は生年月日から計算する項目
  if(k === '__lastNo') return r.__lastNo ? '第' + r.__lastNo + '回' : '';
  const v = r[k];
  if(v === undefined || v === null) return '';
  return String(v);
}

function doPrint(){
  drawPrint();
  window.print();
}

function draw(){
  let rows = allRows.filter(function(r){ return String(r.eventNo)===String(curEvent); });
  const nJoin = rows.filter(function(r){ return r.join==='参加する'; }).length;
  const nNo   = rows.filter(function(r){ return r.join==='参加しない'; }).length;
  setText('cJoin', nJoin+'名');
  setText('cNo', nNo+'名');
  setText('sub', '第'+curEvent+'回 ・ 合計 '+rows.length+'名');
  drawPend();                       // 読み込み時と回の切替時に数え直す

  if(curFilter!=='all') rows = rows.filter(function(r){ return r.join===curFilter; });
  if(curQuery) rows = rows.filter(function(r){ return ((r.name||'')+' '+(r.kana||'')).indexOf(curQuery)>-1; });
  rows.sort(function(a,b){ return String(a.kana||'').localeCompare(String(b.kana||''),'ja'); });

  document.getElementById('list').innerHTML = rows.length
    ? rows.map(card).join('')
    : '<div class="note">該当する人がいません。</div>';
}

function card(r){
  const joinB = r.join==='参加する' ? '<span class="b b-join">参加</span>' : '<span class="b b-no">不参加</span>';
  const gB = r.gender==='男性' ? '<span class="b b-m">男性</span>' : (r.gender==='女性' ? '<span class="b b-f">女性</span>' : '');
  const fB = r.firstTime==='はい' ? '<span class="b b-first">初参加</span>' : '';
  const age = calcAge(r.birth);
  const aB  = r.birth
    ? '<span class="b b-age">' + escapeHtml(String(r.birth))
      + (age === null ? '' : '（' + age + '歳）') + '</span>'
    : '';
  const tel = r.phone ? '<a href="tel:'+escapeHtml(r.phone)+'">'+escapeHtml(r.phone)+'</a>' : '<span class="co">―</span>';
  const co = r.company ? '<span class="co">'+escapeHtml(r.company)+'</span>' : '';
  return '<div class="card">'
    + '<div class="top"><div><div class="nm">'+escapeHtml(r.name||'')+'</div><div class="kn">'+escapeHtml(r.kana||'')+'</div></div>'+joinB+'</div>'
    + '<div class="badges">'+gB+fB+aB+'</div>'
    + '<div class="meta">'+tel+co+'</div>'
    + '</div>';
}

function setText(id,t){ const el=document.getElementById(id); if(el) el.textContent=t; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

main().catch(function(err){
  const msg = String(err || '');
  /* ログインの引換券が合わない類。住所欄の印を消して1回だけやり直せば通ることが多い */
  if(/code_verifier|invalid_grant/i.test(msg) && !markedRelogin()){
    markRelogin();
    try {
      app.innerHTML = '<div class="note">ログインし直しています…</div>';
      window.location.replace(cleanUrl());
      return;
    } catch(e){}
  }
  clearLoginFlight();
  app.innerHTML =
    '<div class="note">読み込みに失敗しました。<br><small>' + escapeHtml(msg) + '</small>'
    + '<br><br><b>LINEアプリから開くと確実です。</b>'
    + openInLineHtml()
    + '<br><br><button class="pbtn" onclick="reLogin()">ログインし直す</button>'
    + diagHtml() + '</div>';
});
</script>
</body>
</html>
